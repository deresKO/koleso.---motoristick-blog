            <h1>Spoľahlivé autá: Ktoré modely vydržia roky?</h1>
        </header>
        <p class="odsek">Pri kúpe auta je pre mnohých vodičov najdôležitejším faktorom jeho spoľahlivosť. Nikto nechce tráviť veľa času v servise a míňať stovky eur na neustále opravy. Niektoré autá dokážu pri správnej údržbe najazdiť stovky tisíc kilometrov bez vážnych problémov. Ako si však vybrať vozidlo, ktoré vydrží čo najdlhšie?</p>

        <section>
            <h2>Čo robí auto spoľahlivým?</h2>
            <p class="odsek">Spoľahlivosť automobilu závisí od viacerých faktorov. Dôležitú úlohu zohráva konštrukcia motora, kvalita použitých materiálov, pravidelný servis a spôsob jazdy. Ani najspoľahlivejšie auto sa nezaobíde bez výmeny oleja, filtrov a ďalších opotrebiteľných súčiastok.<br>
                Pri výbere jazdeného vozidla by sme sa nemali pozerať iba na značku alebo rok výroby. Rovnako dôležitý je technický stav konkrétneho auta a jeho servisná história.</p>
    
        </section>
        <section>
            <h2>5 modelov, ktoré stoja za pozornosť</h2>
            <p class="odsek">Medzi modely, ktoré sa často spomínajú pri výbere spoľahlivého jazdeného auta, patria:</p>
            <ol>
                <li><strong>Toyota Corolla</strong> - praktické vozidlo známe svojou jednoduchosťou a dostupnosťou náhradných dielov.</li>
                <li><strong>Honda Civic</strong> - ponúka dobré jazdné vlastnosti a pri správnej údržbe môže slúžiť mnoho rokov.</li>
                <li><strong>Lexus IS</strong> - prémiový sedan, ktorý kombinuje komfort s dôrazom na kvalitu spracovania.</li>
                <li><strong>Škoda Octavia</strong> - obľúbené auto s priestranným interiérom a širokou ponukou motorov.</li>
                <li><strong>Mazda 3</strong> - kompaktné vozidlo, ktoré ponúka príjemné jazdné vlastnosti a úsporné motorizácie.</li>
            </ol>
            <p class="odsek">Treba však pamätať na to, že spoľahlivosť sa líši podľa konkrétneho motora, generácie, nájazdu kilometrov a starostlivosti predchádzajúceho majiteľa.</p>

            <h2>Na čo si dať pozor pri kúpe jazdeného auta?</h2>
            <p class="odsek">Pred kúpou vozidla je vhodné skontrolovať niekoľko základných vecí:</p>
            <ul>
                <li><strong>Servisná história:</strong> over si, či bol olej a filtre menené v odporúčaných intervaloch.</li>
                <li><strong>Motor:</strong> všímaj si nezvyčajné zvuky, dymenie a prípadné úniky oleja.</li>
                <li><strong>Karoséria:</strong> skontroluj koróziu, poškodenia a známky po opravách po nehode.</li>
                <li><strong>Podvozok:</strong> počas skúšobnej jazdy sleduj klepanie a neobvyklé vibrácie.</li>
                <li><strong>Dokumentácia:</strong> porovnaj stav kilometrov so servisnými záznamami.</li>
            </ul>

            <p class="odsek">Kvalitné auto nemusí byť automaticky drahé. Niekedy môže byť starší model s overeným motorom rozumnejšou voľbou ako novšie vozidlo s komplikovanou technikou. Dôležité je vybrať si auto podľa svojich potrieb a finančných možností.<br>
                Pri kúpe jazdeného vozidla sa oplatí investovať aj do kontroly v nezávislom servise. Niekoľko desiatok eur za odbornú prehliadku môže pomôcť odhaliť problémy, ktorých oprava by neskôr stála stovky až tisíce eur.</p>
            <p class="odsek">Spoľahlivé auto je výsledkom dobrej konštrukcie, kvalitného servisu a zodpovedného prístupu majiteľa. Pri výbere by sme sa nemali riadiť iba reklamou alebo skúsenosťami známych, ale aj technickým stavom vozidla. Správne vybrané auto nám môže slúžiť dlhé roky a ušetriť množstvo peňazí aj starostí.</p>

                    <li><a href="#article/7">5 športových áut</a></li>
                </ul>
            </nav>

        <article>
            <header class="hlavicka-clanku">
                <h1>Zimné pneumatiky: kedy ich prezuť a ako ich vybrať</h1>
            </header>
            <p class="odsek">Pneumatiky sú jediným kontaktom auta s vozovkou. Ich štyri plochy veľkosti dlane rozhodujú o tom, ako auto zrýchli, zabrzdí a prejde zákrutu. Práve preto na nich nemožno šetriť, najmä v zime, keď sa podmienky na ceste menia z hodiny na hodinu.</p>

            <section>
                <h2>Kedy prezúvať?</h2>
                <p class="odsek">Zimné pneumatiky sa oplatí nasadiť, keď teplota dlhodobo klesne pod približne 7 °C. Pri nižších teplotách zmes letných pneumatík tvrdne a prilnavosť sa výrazne zhoršuje, aj keď na ceste nie je sneh ani ľad. Zimná zmes zostáva mäkká aj pri mraze, a preto lepšie drží na studenom asfalte.</p>
                <p class="odsek">Na Slovensku platí povinnosť jazdiť na zimných pneumatikách, ak je vozovka súvislo pokrytá snehom, ľadom alebo námrazou. Praktické pravidlo je jednoduché: prezúvaj na jeseň s prvými ranými mrazmi a na jar až keď sa teploty stabilne držia nad 7 °C.</p>
            </section>

            <section>
                <h2>Z čoho sa pneumatika skladá</h2>
                <figure>
                    <img src="fig/pneu-rez.svg" alt="Schéma pneumatiky s popisom dezénu, nárazníka, bočnice a ráfika" class="obrazok1" width="640" height="360" loading="lazy">
                    <figcaption>Základné časti pneumatiky: dezén, nárazník, bočnica a ráfik.</figcaption>
                </figure>
                <p class="odsek">Dezén je časť, ktorá sa dotýka vozovky a odvádza vodu a sneh. Pod ním sú oceľové pásy, ktoré držia tvar pneumatiky, a po stranách bočnice, ktoré prenášajú sily pri zatáčaní.</p>
            </section>

            <section>
                <h2>Letná, zimná alebo celoročná?</h2>
                <figure>
                    <img src="fig/pneu-dezeny.svg" alt="Porovnanie dezénu letnej, zimnej a celoročnej pneumatiky" class="obrazok1" width="720" height="300" loading="lazy">
                    <figcaption>Letný dezén má široké drážky, zimný množstvo jemných lamiel a celoročný je kompromis.</figcaption>
                </figure>
                <div class="tabulka">
                    <table>
                        <caption>Porovnanie typov pneumatík</caption>
                        <thead>
                            <tr><th scope="col">Vlastnosť</th><th scope="col">Zimná</th><th scope="col">Celoročná</th><th scope="col">Letná</th></tr>
                        </thead>
                        <tbody>
                            <tr><td class="a"><strong>Optimálna teplota</strong></td><td>pod 7 °C</td><td>-5 až 25 °C</td><td>nad 7 °C</td></tr>
                            <tr><td class="a"><strong>Sneh a ľad</strong></td><td>výborná</td><td>priemerná</td><td>nevhodná</td></tr>
                            <tr><td class="a"><strong>Suchá vozovka v lete</strong></td><td colspan="2">horšia, rýchlejšie sa opotrebuje</td><td>výborná</td></tr>
                            <tr><td class="a"><strong>Cena a nákup</strong></td><td rowspan="2">dve sady = vyššie náklady, výmena dvakrát ročne</td><td>jedna sada, nižšie náklady</td><td rowspan="2">lacnejšie, hodí sa pri ročnom prezúvaní</td></tr>
                            <tr><td class="a"><strong>Pohodlie</strong></td><td>kompromis</td></tr>
                        </tbody>
                        <tfoot>
                            <tr><td colspan="4">Údaje sú orientačné a líšia sa podľa výrobcu a modelu.</td></tr>
                        </tfoot>
                    </table>
                </div>
                <p class="odsek">Celoročné pneumatiky sú rozumná voľba pre vodičov, ktorí jazdia hlavne po meste a v nížinách. Ak jazdíš v horách alebo často vyrážaš za sneh, zimné pneumatiky sú bezpečnejšie.</p>
            </section>

            <section>
                <h2>Prečo na zimných pneumatikách záleží</h2>
                <figure>
                    <img src="fig/brzdna-draha.svg" alt="Stĺpcový graf brzdnej dráhy na snehu pre zimnú, celoročnú a letnú pneumatiku" class="obrazok1" width="640" height="320" loading="lazy">
                    <figcaption>Orientačná brzdná dráha z 50 km/h na snehu: rozdiel medzi zimnou a letnou pneumatikou je viac ako dvojnásobný.</figcaption>
                </figure>
                <p class="odsek">Rozdiel v brzdnej dráhe môže byť desiatky metrov. Pri rýchlosti 50 km/h to znamená, že auto na letných pneumatikách ešte ide rýchlosťou, pri ktorej auto na zimných už stojí.</p>
            </section>

            <section>
                <h2>Na čo sa pozrieť pri kúpe</h2>
                <ul>
                    <li><strong>Označenie:</strong> hľadaj symbol snehovej vločky v hore (3PMSF), ktorý potvrdzuje skutočnú zimnú pneumatiku.</li>
                    <li><strong>Dezén:</strong> zákonné minimum je 3 mm, odporúča sa však 4 mm a viac.</li>
                    <li><strong>Rok výroby:</strong> kód DOT udáva týždeň a rok, pneumatiky staršie ako 6 rokov radšej nekupuj.</li>
                    <li><strong>Rozmer:</strong> musí zodpovedať údajom v technickom preukaze.</li>
                    <li><strong>Test:</strong> pozri si nezávislé testy pneumatík, kde sa porovnáva brzdenie, hluk aj spotreba.</li>
                </ul>
            </section>

            <section>
                <h2>Ako čítať označenie na boku</h2>
                <p class="odsek">Na bočnici pneumatiky nájdeš kód, napríklad <strong>205/55 R16 91 H</strong>. Znamená:</p>
                <ol>
                    <li><strong>205</strong> - šírka pneumatiky v milimetroch.</li>
                    <li><strong>55</strong> - výška bočnice v percentách šírky.</li>
                    <li><strong>R16</strong> - radiálna konštrukcia a priemer ráfika v palcoch.</li>
                    <li><strong>91</strong> - index nosnosti (615 kg na pneumatiku).</li>
                    <li><strong>H</strong> - rýchlostný index (do 210 km/h).</li>
                </ol>
            </section>

            <section>
                <h2>Starostlivosť a skladovanie</h2>
                <p class="odsek">Pneumatiky skladuj na suchom a chladnom mieste mimo priameho slnka a chemikálií. Pred uložením ich umy a označ si polohu na aute (PP, ZP, PZ, ZZ). Zložené kolesá na diskoch ukladaj naležato na seba alebo ich zavesiť, samotné pneumatiky postav na behúň.</p>
                <p class="odsek">Dvakrát ročne nechaj kolesá vyvážiť a pravidelne kontroluj tlak, ktorý sa pri poklese teploty o 10 °C zníži približne o 0,1 bar. Po prvých 500 km po prezutí dotiahni kolesové skrutky.</p>
            </section>

            <section>
                <h2>Najčastejšie chyby</h2>
                <ul>
                    <li>Mixovanie rôznych typov a značiek na jednej náprave.</li>
                    <li>Jazda na prestarých pneumatikách s tvrdnúcou zmesou.</li>
                    <li>Zanedbaný tlak a nevyvážené kolesá.</li>
                    <li>Odkladanie prezutia, až kým nenapadne sneh.</li>
                </ul>
            </section>

        <p class="odsek"><a href="#welcome" class="spat">&larr; Späť na hlavnú stránku</a></p>
    
    </script>

    <script id="template-opinions" type="text/template">
        <h1>Názory návštevníkov</h1>
        {{#.}}
        <section class="nazor">
            <h2>{{name}} <i>{{createdDate}}</i></h2>
            {{#image}}<img src="{{image}}" alt="Auto od {{name}}" loading="lazy">{{/image}}
            <p>{{comment}}</p>
            <p class="meta">E-mail: <a href="mailto:{{email}}">{{email}}</a></p>
            <p class="meta">Pohon: {{drive}}{{#keyword}} · Kľúčové slovo: {{keyword}}{{/keyword}}</p>
            <p class="meta">{{willReturnMessage}}</p>
        </section>
        {{/.}}
        {{^.}}
        <p class="odsek">Zatiaľ tu nie sú žiadne názory. <a href="#addOpinion">Buď prvý!</a></p>
        {{/.}}
    </script>

    <script id="template-opinions-welcome" type="text/template">
        {{#.}}
        <section class="nazor">
            <h3>{{name}} <i>{{createdDate}}</i></h3>
            {{#image}}<img src="{{image}}" alt="Auto od {{name}}" loading="lazy">{{/image}}
            <p>{{comment}}</p>
            <p class="meta">E-mail: <a href="mailto:{{email}}">{{email}}</a></p>
            <p class="meta">Pohon: {{drive}}{{#keyword}} · Kľúčové slovo: {{keyword}}{{/keyword}}</p>
            <p class="meta">{{willReturnMessage}}</p>
        </section>
        {{/.}}
        {{^.}}
        <p class="odsek">Zatiaľ tu nie sú žiadne názory. <a href="#addOpinion">Buď prvý!</a></p>
        {{/.}}
    </script>

    <script id="template-addOpinion" type="text/template">
        <h1>Váš názor</h1>
        <form id="opnFrm" class="formular">
                <label for="nameElm">Meno</label>
                <input type="text" id="nameElm" name="meno" maxlength="50" placeholder="Ako sa voláš?" required>

                <label for="emailElm">E-mail</label>
                <input type="email" id="emailElm" name="email" placeholder="meno@example.com" required>

                <label for="urlElm">Fotka tvojho auta (URL, nepovinné)</label>
                <input type="url" id="urlElm" name="obrazok" placeholder="https://...">

                <label for="keywordsElm">Kľúčové slovo, ktoré sa hodí na blog</label>
                <input type="text" id="keywordsElm" name="kluc" list="kluc-slova" placeholder="napr. hybrid">
                <datalist id="kluc-slova">
                    <option value="spoľahlivosť">
                    <option value="údržba">
                    <option value="zimné pneumatiky">
                    <option value="jazdené autá">
                    <option value="hybrid">
                    <option value="elektromobil">
                    <option value="spotreba">
                    <option value="hudba v aute">
                </datalist>

                <fieldset>
                    <legend>Aký pohon jazdíš?</legend>
                    <label><input type="radio" name="pohon" value="benzín" checked> Benzín</label>
                    <label><input type="radio" name="pohon" value="diesel"> Diesel</label>
                    <label><input type="radio" name="pohon" value="hybrid"> Hybrid</label>
                    <label><input type="radio" name="pohon" value="elektro"> Elektro</label>
                </fieldset>

                <label for="opnElm">Tvoj názor</label>
                <textarea id="opnElm" name="komentar" rows="4" placeholder="Čo si myslíš o blogu?" required></textarea>

                <label class="riadok"><input type="checkbox" id="willReturnElm" name="vratim"> Určite sa na blog ešte vrátim</label>

                <div class="tlacidla">
                    <button type="submit">Odoslať</button>
                    <button type="reset">Vymazať</button>
                </div>
            </form>
    </script>

    <script id="template-articles" type="text/template">
        <h1>Články zo servera</h1>
        <p class="odsek">Strana {{currPage}} z {{pageCount}} (spolu {{totalCount}} článkov).</p>
        {{#articles}}
        <section class="nazor">
            <h2>{{title}}</h2>
            <p class="meta">autor: {{author}}</p>
        </section>
        {{/articles}}
        <p class="strankovanie">
            {{#prevPage}}<a href="#articles/{{prevPage}}">&laquo; Predchádzajúca (Previous)</a>{{/prevPage}}
            {{#nextPage}}<a href="#articles/{{nextPage}}">Ďalšia (Next) &raquo;</a>{{/nextPage}}
        </p>
    </script>

    <script id="template-articles-error" type="text/template">
        <h1>Články sa nepodarilo načítať</h1>
        <p class="odsek">{{errMessage}}</p>
        <p class="odsek"><a href="#welcome" class="spat">&larr; Späť na hlavnú stránku</a></p>
    </script>

    <script id="template-notfound" type="text/template">
        <h1>Stránka sa nenašla</h1>
        <p class="odsek"><a href="#welcome" class="spat">&larr; Späť na hlavnú stránku</a></p>
    </script>

    <script src="js/mustache.min.js"></script>
    <script type="module" src="js/index.js"></script>
</body>
</html>
